<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="100%" height="100%" style="background-color: #0b0f19; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title & Header -->
  <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">PORTFOLIO SITEMAP WIREFRAME &amp; SKETCH</text>
  <text x="450" y="60" text-anchor="middle" fill="#94a3b8" font-size="13">Target: Senior ML Hiring Manager • Single Action: Book Technical Chat</text>

  <!-- Flow Connector Lines -->
  <path d="M 450 195 L 235 240" stroke="#6366f1" stroke-width="2" stroke-dasharray="6,4" />
  <path d="M 450 195 L 665 240" stroke="#6366f1" stroke-width="2" stroke-dasharray="6,4" />
  <path d="M 450 195 L 450 515" stroke="#10b981" stroke-width="2" />
  <path d="M 235 460 L 450 515" stroke="#10b981" stroke-width="2" />
  <path d="M 665 460 L 450 515" stroke="#10b981" stroke-width="2" />

  <!-- Node 1: HERO SECTION -->
  <g filter="url(#shadow)">
    <rect x="210" y="90" width="480" height="105" rx="10" fill="url(#heroGrad)" stroke="#818cf8" stroke-width="1.5" />
    <text x="450" y="118" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">1. HERO LANDING (Main Claim)</text>
    <text x="450" y="140" text-anchor="middle" fill="#e0e7ff" font-size="12">"I build production ML/AI systems with verifiable metrics &amp; clean web UIs"</text>
    <rect x="320" y="153" width="260" height="26" rx="6" fill="#ffffff" fill-opacity="0.2"/>
    <text x="450" y="170" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">⚡ Primary CTA: Book 15-Min Intro Chat</text>
  </g>

  <!-- Node 2: PROOF & CASE STUDIES -->
  <g filter="url(#shadow)">
    <rect x="45" y="240" width="380" height="220" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="45" y="240" width="380" height="34" rx="10" fill="#0f172a" />
    <text x="235" y="262" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">2. PROOF (Case Studies &amp; Projects)</text>
    <line x1="45" y1="274" x2="425" y2="274" stroke="#334155" stroke-width="1"/>
    
    <!-- Bullet 1 -->
    <text x="65" y="298" fill="#f1f5f9" font-size="12" font-weight="600">• Capstone ML Model</text>
    <text x="80" y="315" fill="#94a3b8" font-size="11">Metrics: F1 Score 0.94 | 12ms Latency</text>

    <!-- Bullet 2 -->
    <text x="65" y="338" fill="#f1f5f9" font-size="12" font-weight="600">• Live Interactive Web Demos</text>
    <text x="80" y="355" fill="#94a3b8" font-size="11">Streamlit &amp; Next.js deployments</text>

    <!-- Bullet 3 -->
    <text x="65" y="378" fill="#f1f5f9" font-size="12" font-weight="600">• Executable Code &amp; Notebooks</text>
    <text x="80" y="395" fill="#94a3b8" font-size="11">GitHub repos &amp; benchmark notebooks</text>

    <!-- Goal Sub-box -->
    <rect x="65" y="418" width="340" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="235" y="436" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">Goal: Instant Technical Credibility &amp; Trust</text>
  </g>

  <!-- Node 3: ABOUT & TOOLKIT -->
  <g filter="url(#shadow)">
    <rect x="475" y="240" width="380" height="220" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5" />
    <rect x="475" y="240" width="380" height="34" rx="10" fill="#0f172a" />
    <text x="665" y="262" text-anchor="middle" fill="#c084fc" font-size="14" font-weight="700">3. ABOUT &amp; TOOLSTACK</text>
    <line x1="475" y1="274" x2="855" y2="274" stroke="#334155" stroke-width="1"/>

    <!-- Bullet 1 -->
    <text x="495" y="298" fill="#f1f5f9" font-size="12" font-weight="600">• Micro Bio &amp; Track Focus</text>
    <text x="510" y="315" fill="#94a3b8" font-size="11">AI Fluency &amp; ML Track Intern</text>

    <!-- Bullet 2 -->
    <text x="495" y="338" fill="#f1f5f9" font-size="12" font-weight="600">• AI Toolstack Proficiency</text>
    <text x="510" y="355" fill="#94a3b8" font-size="11">Claude, ChatGPT, Gemini, Antigravity</text>

    <!-- Bullet 3 -->
    <text x="495" y="378" fill="#f1f5f9" font-size="12" font-weight="600">• Verified Credentials</text>
    <text x="510" y="395" fill="#94a3b8" font-size="11">FlyRank Cohort &amp; Anthropic Badges</text>

    <!-- Goal Sub-box -->
    <rect x="495" y="418" width="340" height="28" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="665" y="436" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="600">Goal: Demonstrate Rigor &amp; AI Stack Mastery</text>
  </g>

  <!-- Node 4: THE ONE ACTION (CTA / CONTACT) -->
  <g filter="url(#shadow)">
    <rect x="240" y="515" width="420" height="110" rx="12" fill="url(#ctaGrad)" stroke="#34d399" stroke-width="2" />
    <text x="450" y="550" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">4. THE ONE ACTION (Contact &amp; Booking)</text>
    <text x="450" y="576" text-anchor="middle" fill="#ecfdf5" font-size="14" font-weight="600">"Book a 15-min Technical Intro Chat"</text>
    <text x="450" y="598" text-anchor="middle" fill="#d1fae5" font-size="11">Frictionless Calendly Embed + LinkedIn &amp; Direct Email</text>
  </g>
</svg>
