<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Slate Canvas Background -->
  <rect width="800" height="400" fill="#F8FAFC"/>
  
  <!-- Architectural Technical Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0F172A" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="400" fill="url(#grid)"/>
  <rect width="800" height="400" fill="url(#grad)"/>
  
  <!-- Subtle Blueprint Tech Sapphire Accent Lines -->
  <line x1="0" y1="120" x2="800" y2="120" stroke="#1E40AF" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="4 4"/>
  <line x1="0" y1="280" x2="800" y2="280" stroke="#1E40AF" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="4 4"/>
  <line x1="240" y1="0" x2="240" y2="400" stroke="#1E40AF" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="4 4"/>
  <line x1="560" y1="0" x2="560" y2="400" stroke="#1E40AF" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="4 4"/>
  
  <!-- Precision Nodes -->
  <circle cx="240" cy="120" r="4" fill="#1E40AF"/>
  <circle cx="560" cy="120" r="4" fill="#1E40AF"/>
  <circle cx="240" cy="280" r="4" fill="#059669"/>
  <circle cx="560" cy="280" r="4" fill="#059669"/>
  
  <!-- Label badge -->
  <rect x="260" y="180" width="280" height="40" rx="6" fill="#0F172A"/>
  <text x="400" y="205" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#F8FAFC" text-anchor="middle">KEEP_CONNECTIVE_TEXTURE_V3.SVG</text>
</svg>
