  <text x="42" y="104" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">// JSON-RPC 2.0 Outbound Tool Request</text>
  <text x="42" y="124" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F8FAFC">{"jsonrpc": "2.0", "method": "tools/call", "id": 101, "params": {</text>
  <text x="62" y="144" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FBBF24">  "name": "write_file",</text>
  <text x="62" y="164" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A5F3FC">  "arguments": {"path": "C:\\...\\scratch\\mcp_audit_test.json", "content": "{\"status\":\"ACTIVE_VERIFIED\"}"}</text>
  <text x="42" y="174" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F8FAFC">}}</text>
  
  <!-- Response 1 -->
  <text x="28" y="208" font-family="'JetBrains Mono', monospace" font-size="12" fill="#10B981">◀ [MCP_RESPONSE] 200 OK — File written to disk (212 bytes committed)</text>

  <!-- Step 2: Tool Call Metadata Check -->
  <text x="28" y="244" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38BDF8">▶ [MCP_DISPATCH] Invoking Tool: filesystem.get_file_info</text>
  
  <rect x="28" y="254" width="804" height="74" rx="6" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
  <text x="42" y="276" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">// Inode Metadata Resolution</text>
  <text x="42" y="296" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F8FAFC">{"jsonrpc": "2.0", "method": "tools/call", "id": 102, "params": {</text>
  <text x="62" y="316" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FBBF24">  "name": "get_file_info", "arguments": {"path": "C:\\...\\scratch\\mcp_audit_test.json"}</text>
  <text x="42" y="322" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F8FAFC">}}</text>

