  <text x="737" y="25" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#6EE7B7">TOOL CALL: ACTIVE</text>
  
  <!-- Body Content -->
  <!-- Step 1: Tool Call Write -->
  <text x="28" y="72" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38BDF8">▶ [MCP_DISPATCH] Invoking Tool: filesystem.write_file</text>
  
